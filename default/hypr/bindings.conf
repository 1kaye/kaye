# Kaye OS — Default Keybindings (using bindd so `kaye menu keybindings` can display descriptions)
$mainMod = SUPER

# Core Launcher & Shell Menus (Quickshell IPC)
bindd = $mainMod, Space, Kaye Menu, exec, qs -p $KAYE_PATH/shell ipc call menu toggle root
bindd = $mainMod ALT, Space, App Launcher, exec, qs -p $KAYE_PATH/shell ipc call menu toggle apps
bindd = $mainMod, K, Show Keybindings, exec, qs -p $KAYE_PATH/shell ipc call menu keybindings
bindd = $mainMod SHIFT, B, Toggle Top Bar, exec, kaye bar toggle

# Applications
bindd = $mainMod, Return, Open Terminal, exec, uwsm app -- foot
bindd = $mainMod, E, Open File Manager, exec, uwsm app -- thunar
bindd = $mainMod, B, Open Browser, exec, uwsm app -- xdg-open https://

# Window Management
bindd = $mainMod, Q, Close Active Window, killactive,
bindd = $mainMod, F, Fullscreen Window, fullscreen, 0
bindd = $mainMod, V, Toggle Floating, togglefloating,
bindd = $mainMod, J, Toggle Split Direction, togglesplit,

# Focus Movement
bindd = $mainMod, left, Focus Left, movefocus, l
bindd = $mainMod, right, Focus Right, movefocus, r
bindd = $mainMod, up, Focus Up, movefocus, u
bindd = $mainMod, down, Focus Down, movefocus, d

# Workspaces 1..9
bindd = $mainMod, 1, Workspace 1, workspace, 1
bindd = $mainMod, 2, Workspace 2, workspace, 2
bindd = $mainMod, 3, Workspace 3, workspace, 3
bindd = $mainMod, 4, Workspace 4, workspace, 4
bindd = $mainMod, 5, Workspace 5, workspace, 5
bindd = $mainMod, 6, Workspace 6, workspace, 6
bindd = $mainMod, 7, Workspace 7, workspace, 7
bindd = $mainMod, 8, Workspace 8, workspace, 8
bindd = $mainMod, 9, Workspace 9, workspace, 9

bindd = $mainMod SHIFT, 1, Move to Workspace 1, movetoworkspace, 1
bindd = $mainMod SHIFT, 2, Move to Workspace 2, movetoworkspace, 2
bindd = $mainMod SHIFT, 3, Move to Workspace 3, movetoworkspace, 3
bindd = $mainMod SHIFT, 4, Move to Workspace 4, movetoworkspace, 4
bindd = $mainMod SHIFT, 5, Move to Workspace 5, movetoworkspace, 5
bindd = $mainMod SHIFT, 6, Move to Workspace 6, movetoworkspace, 6
bindd = $mainMod SHIFT, 7, Move to Workspace 7, movetoworkspace, 7
bindd = $mainMod SHIFT, 8, Move to Workspace 8, movetoworkspace, 8
bindd = $mainMod SHIFT, 9, Move to Workspace 9, movetoworkspace, 9

# Mouse Window Controls
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Utilities & System
bindd = $mainMod, L, Lock Screen, exec, qs -p $KAYE_PATH/shell ipc call lock open
bindd = $mainMod CTRL, I, Toggle Stay Awake, exec, kaye toggle stay-awake
bindd = $mainMod CTRL, N, Toggle Night Light, exec, kaye toggle nightlight
bindd = $mainMod SHIFT, S, Screenshot Area to Clipboard, exec, grim -g "$(slurp)" - | wl-copy
bindd = , Print, Screenshot Fullscreen to Clipboard, exec, grim - | wl-copy

# Media & Brightness (triggers Quickshell OSD)
bindel = , XF86AudioRaiseVolume, exec, pamixer -i 5 && qs -p $KAYE_PATH/shell ipc call osd volume "$(pamixer --get-volume)"
bindel = , XF86AudioLowerVolume, exec, pamixer -d 5 && qs -p $KAYE_PATH/shell ipc call osd volume "$(pamixer --get-volume)"
bindl  = , XF86AudioMute, exec, pamixer -t && qs -p $KAYE_PATH/shell ipc call osd mute "$(pamixer --get-mute)"
bindel = , XF86MonBrightnessUp, exec, brightnessctl set +5% && qs -p $KAYE_PATH/shell ipc call osd brightness "$(brightnessctl -m | cut -d, -f4 | tr -d '%')"
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%- && qs -p $KAYE_PATH/shell ipc call osd brightness "$(brightnessctl -m | cut -d, -f4 | tr -d '%')"
