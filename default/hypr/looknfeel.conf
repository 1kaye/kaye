# Kaye OS — Default Look & Feel
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 8
    active_opacity = 1.0
    inactive_opacity = 0.98

    blur {
        enabled = true
        size = 5
        passes = 2
        new_optimizations = true
    }

    shadow {
        enabled = true
        range = 14
        render_power = 3
    }
}

animations {
    enabled = true
    bezier = kayeOut, 0.16, 1, 0.3, 1
    animation = windows, 1, 3, kayeOut, popin 92%
    animation = windowsOut, 1, 2, kayeOut, popin 92%
    animation = fade, 1, 2, kayeOut
    animation = workspaces, 1, 3, kayeOut, slide
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vfr = true
}
