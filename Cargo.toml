[package]
name = "kaye"
version = "1.1.0"
edition = "2024"
description = "KAYE - Keep All Your Experiments. Local Shadow-Git Version Control System for developers and LLMs."
authors = ["1kaye"]
license = "MIT"

[[bin]]
name = "kaye"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
