# Kaye OS — User Entrypoint (~/.config/hypr/hyprland.conf)
# Loads Kaye OS defaults first, then your personal overrides, then the active theme.

$KAYE_PATH = ~/kaye

# 1. Kaye OS defaults (managed by repo)
source = $KAYE_PATH/default/hypr/env.conf
source = $KAYE_PATH/default/hypr/input.conf
source = $KAYE_PATH/default/hypr/looknfeel.conf
source = $KAYE_PATH/default/hypr/bindings.conf
source = $KAYE_PATH/default/hypr/windows.conf
source = $KAYE_PATH/default/hypr/autostart.conf

# 2. Personal overrides (safe to edit freely)
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/bindings.conf
source = ~/.config/hypr/looknfeel.conf
source = ~/.config/hypr/autostart.conf

# 3. Active theme colors (rendered by `kaye theme set`)
source = ~/.local/state/kaye/current/theme/hyprland.conf
