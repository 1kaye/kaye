[package]
name = "kaye"
version = "0.1.0"
edition = "2021"
description = "Kaye OS CLI, theme engine, config manager, and Quickshell menu/search backend"

[[bin]]
name = "kaye"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
lto = true
codegen-units = 1
strip = true
